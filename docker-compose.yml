version: '3.8'

services:
  job-collector:
    build: .
    container_name: job-vacancy-collector
    ports:
      - "8502:8501" # Maps HOST port 8502 to CONTAINER port 8501
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
