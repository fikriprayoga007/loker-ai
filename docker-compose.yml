version: '3.8'

services:
  loker-ai:
    build: .
    container_name: container_loker-ai
    ports:
      - "8502:8501" # Tetap ada untuk akses LAN (http://ip-server:8502)
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0

